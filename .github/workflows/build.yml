name: Build NeonView

# Сборка запускается автоматически при загрузке NeonView.zip в репозиторий
# (или вручную: вкладка Actions → Build NeonView → Run workflow).
on:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4

      - name: Распаковать исходники из NeonView.zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Recurse -Filter "NeonView*.zip" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $zip) { throw "В репозитории не найден архив NeonView.zip" }
          Write-Host "Архив: $($zip.FullName)"
          $src = Join-Path $env:RUNNER_TEMP "src"
          Expand-Archive -Path $zip.FullName -DestinationPath $src -Force
          $proj = Get-ChildItem $src -Recurse -Filter "NeonView.csproj" | Select-Object -First 1
          if (-not $proj) { throw "В архиве не найден NeonView.csproj" }
          $root = Split-Path (Split-Path (Split-Path $proj.FullName -Parent) -Parent) -Parent
          $ver = "1.0.${{ github.run_number }}"
          "ROOT=$root"     | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PROJ=$($proj.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VER=$ver"       | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PUB=$(Join-Path $env:RUNNER_TEMP 'publish')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Установить .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Собрать приложение (Release, x64, self-contained)
        shell: pwsh
        run: |
          dotnet publish "$env:PROJ" -c Release -r win-x64 --self-contained true `
            -p:Version=$env:VER -p:FileVersion=$env:VER -p:AssemblyVersion=$env:VER `
            -o "$env:PUB"
          if ($LASTEXITCODE -ne 0) { throw "Сборка завершилась с ошибкой" }
          if (-not (Test-Path (Join-Path $env:PUB "NeonView.exe"))) { throw "NeonView.exe не создан" }

      - name: Установить Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }

      - name: Собрать установщик
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:VER" "/DSourceDir=$env:PUB" (Join-Path $env:ROOT "installer\NeonView.iss")
          if ($LASTEXITCODE -ne 0) { throw "Ошибка сборки установщика" }

      - name: Собрать портативную версию
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "out"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item (Join-Path $env:ROOT "installer\output\NeonView-Setup-$env:VER.exe") $out
          Compress-Archive -Path "$env:PUB\*" -DestinationPath (Join-Path $out "NeonView-Portable-$env:VER.zip") -CompressionLevel Optimal
          "OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem $out | Format-Table Name, Length

      - name: Сохранить файлы сборки (вкладка Actions → Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: NeonView-${{ env.VER }}
          path: ${{ env.OUT }}
          retention-days: 30

      - name: Опубликовать релиз (вкладка Releases)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "NeonView $env:VER`n`n• NeonView-Setup-$env:VER.exe — установщик (рекомендуется: регистрация форматов, эскизы, защита брандмауэром).`n• NeonView-Portable-$env:VER.zip — портативная версия без установки."
          gh release create "v$env:VER" `
            (Join-Path $env:OUT "NeonView-Setup-$env:VER.exe") `
            (Join-Path $env:OUT "NeonView-Portable-$env:VER.zip") `
            --repo "${{ github.repository }}" --target "${{ github.sha }}" `
            --title "NeonView $env:VER" --notes "$notes"
